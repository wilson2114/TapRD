    <!-- Prevenir error de getter-only en window.fetch en iframes y DevTools -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          var patchTarget = function(target) {
            try {
              if (!target) return;
              var descriptor = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!descriptor || !descriptor.set) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          };
          if (window.Window && window.Window.prototype) {
            patchTarget(window.Window.prototype);
          }
          patchTarget(window);
        } catch (_) {}
      })();
    </script>

    <!-- Immediate theme initializer to prevent flash of unstyled theme (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('taprd_theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (_) {}
      })();
    </script>
